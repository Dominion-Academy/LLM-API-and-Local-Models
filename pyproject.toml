[project]
name = "localmodelsandllmapi"
version = "0.1.0"
description = "Код курса «LLM API and Local Models»"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "ollama>=0.6.3",
    "openai>=2.0",
    "pydantic-settings>=2.0",
    "tiktoken>=0.9",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
